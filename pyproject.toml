[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapa-lp-heuristica"
version = "0.2.0"
description = "Resolvedor de Tapa por propagação + backtracking, com heurística de Programação Linear"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pulp>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openpyxl>=3.1"]
highs = ["highspy>=1.7"]

[project.scripts]
tapa-solver-api = "tapa_solver_deterministico.api:run"
tapa-lp = "tapa_lp.cli:main"
tapa-web = "tapa_lp.server:run"

[tool.setuptools.packages.find]
where = ["src"]
